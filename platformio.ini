[platformio]
default_envs = linux_x86_64
boards_dir = ll_pio/boards
core_dir = ~/.platformio-idf55

; ============================================================================
; PLATFORM PIN -- DO NOT UNPIN, AND DO NOT BUMP WITHOUT RE-MEASURING MEMORY.
;   = Arduino core 3.3.11 = ESP-IDF 5.5.5   (published 2026-07-24)
; A bare `platform = espressif32` FLOATS to whatever happens to be installed, which
; is why this is pinned at all; the pin is a release URL, so it is also the only
; in-tree record of which core this project is built against.
;
; WHY NOT THE OFFICIAL PLATFORM: platform-espressif32 7.0.1 (PlatformIO's current
; official release) still pins framework-arduinoespressif32 ~3.20017.0 = Arduino
; 2.0.17 = ESP-IDF 4.4.7, which went EOL ~mid-2024.  The official platform never
; advanced the core past 2.0.17, so `framework = arduino` there IS a choice to stay
; on an EOL IDF.  pioarduino is the fork that tracks current Arduino/IDF while
; keeping `framework = arduino`.
;
; WHAT THIS MIGRATION IS FOR: IDF 4.4.7 has no esp_mmu_map(), no PSRAM MMU target,
; and its esp_ptr_executable() excludes the whole 0x3D000000 PSRAM window -- so NCG
; code could only ever live in the 32 KB D/IRAM pool.  IDF 5.x has esp_mmu_map() +
; MMU_MEM_CAP_EXEC + MMU_TARGET_PSRAM0 on the S3.  Whether PSRAM can actually back
; an EXECUTABLE mapping is STILL UNVERIFIED: the primitives exist, the capability
; has not been demonstrated.  Do NOT record it as working until a stub has been
; written into PSRAM and successfully called.
;
; RE-MEASURE BEFORE TRUSTING ANY MEMORY CONSTANT.  These were measured against the
; ESP-IDF 4.4.7 layout and are NOT valid here until re-taken:
;   - LL_NCG_EXEC_POOL_BYTES = 32 KB (ll_platform_generic.h), measured twice over
;     on the S3 and the LX6, not guessed;
;   - the B95 internal-DRAM cliff: at a 128 KB pool the N8R2 had 500 bytes of
;     INTERNAL DRAM free after setup, so every 512-byte LittleFS read returned
;     ESP_ERR_NO_MEM (err 257).
; THE SYMPTOM TO RECOGNISE: a layout change does NOT present as an allocation error
; -- it presents as MISSING TEST FILES, because the reads fail, not the allocations.
; ============================================================================
[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

; ESP32-S3 DevKit-C: 8MB flash, 2MB PSRAM. CHIP-DETECTED 2026-08-22 (esptool flash_id on MAC dc:da:0c:61:9f:0c: 'Detected flash size: 8MB', device c8:4017, 'Embedded PSRAM 2MB'). Previously declared N4R8/flash_mb=4, which selected partitions_4M.csv and capped app0 at 1.47MB -- 99.3% full -- while ~4MB of the chip stayed unpartitioned. nxry and the chip flag were corrected to N8R2 to match (2026-08-22): the old -DLL_ESP32_N4R8 was not even a declared flag -- ll_platform_generic.h declares LL_ESP32_N4R4 and LL_ESP32S3_N8R2, never LL_ESP32_N4R8 -- and neither flag is read anywhere in the tree, so this is metadata only, no behaviour change.
[env:linux_x86_64]
extends = common
platform = linux_x86_64
build_flags =
    -DLL_BOARD_NAME='"linux_x86_64"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_POSIX=1
    -DLLARDUINO=1
    -DLL_COMMONIO=1
    -DLL_COMPLEX=1
    -DLL_RATIONAL=1
    -DLL_BIGNUM=1
    -DLL_MODBUS=1
    -DLL_PROFIBUS=1
    -flto=auto
    -march=x86-64-v2
    -mtune=native
    -DLL_PROFINET=1
    -D_POSIX_C_SOURCE=200809L
    -Wl,--wrap=fmod
    -Wl,--wrap=fmodf
    -Wl,--wrap=strtol
    -Wl,--wrap=strtoll
    -Wl,--wrap=strtoul
    -Wl,--wrap=__isoc23_strtol
    -Wl,--wrap=__isoc23_strtoll
    -Wl,--wrap=__isoc23_strtoul
    -Wl,--wrap=__isoc23_sscanf
    -Wl,--wrap=__isoc23_fscanf
    -Wl,--undefined=__wrap_fmod
    -Wl,--undefined=__wrap_fmodf
    -Wl,--undefined=__wrap_strtol
    -Wl,--undefined=__wrap_strtoll
    -Wl,--undefined=__wrap_strtoul
    -Wl,--undefined=__wrap___isoc23_strtol
    -Wl,--undefined=__wrap___isoc23_strtoll
    -Wl,--undefined=__wrap___isoc23_strtoul
    -Wl,--undefined=__wrap___isoc23_sscanf
    -Wl,--undefined=__wrap___isoc23_fscanf
    -DLL_AMD64=1
    -DLL_X86_64=1
    -L$PROJECT_DIR
    -llamblisp

